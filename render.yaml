services:
  - type: web
    name: codeai-v1
    runtime: node
    plan: free
    buildCommand: npm install
    startCommand: npm start
    healthCheckPath: /api/health
    envVars:
      - key: NODE_ENV
        value: production
      # Set these two in the Render dashboard when creating the service
      # (Blueprint prompts for sync:false values). Never commit real keys.
      - key: GROQ_API_KEY
        sync: false
      - key: NVIDIA_API_KEY
        sync: false
      - key: NVIDIA_MODEL
        value: nvidia/nemotron-3-ultra-550b-a55b
      # Groq primary model (llama-3.3-70b-versatile is enterprise-only
      # since Aug 2026; gpt-oss-120b is the self-serve production model)
      - key: MODEL
        value: openai/gpt-oss-120b
